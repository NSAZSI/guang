# AdPulse 生产站点配置
# 放置位置（Ubuntu）：/etc/nginx/sites-available/adpulse.conf
# 启用：sudo ln -s /etc/nginx/sites-available/adpulse.conf /etc/nginx/sites-enabled/
#       sudo mv /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.disabled  # 避免默认站点抢占 80
#       sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;   # 有域名后替换为你的域名

    root /var/adpulse/www;
    index index.html;
    client_max_body_size 20m;   # 上传封面不被 413 拦截

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---------- SSE 专属段（必须写在 /api/ 之前）----------
    # 快讯的生命线：关闭缓冲，否则 Nginx 会把流式推送"憋住"
    location /api/sse/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---------- 常规 API 反代 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 用户上传与种子封面：直接由 Nginx 发静态文件 ----------
    location /uploads/ {
        alias /var/adpulse/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /covers/ {
        alias /var/adpulse/api/wwwroot/covers/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 前端静态资源缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------- 生产环境明确关闭 Swagger（后端也已禁用，双保险） ----------
    location /swagger/ {
        return 404;
    }

    # ---------- history 路由回退：详情页直接刷新不 404 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}